name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test -race -short ./...
      - run: go test ./...

  # The engine against the reference evaluator, at full size, and every
  # deliberate bug caught.
  hunt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build -o authz-proof ./cmd/authz-proof
      - run: ./authz-proof hunt --seeds 20000
      - run: ./authz-proof mutants --seeds 500

  # Every check on the examples and on 600 random models, asked of a real
  # SpiceDB too. Its dispatch cache is off; see the spicedb-cache job.
  spicedb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Start SpiceDB
        run: |
          docker run -d --init --name spicedb -p 8443:8443 authzed/spicedb:v1.56.2 \
            serve --grpc-preshared-key testkey --datastore-engine memory --http-enabled --dispatch-cache-enabled=false
          for i in $(seq 30); do curl -s -o /dev/null localhost:8443 && break; sleep 1; done
      - run: go test -count=1 -v ./spicedb
        env:
          SPICEDB_ENDPOINT: http://localhost:8443
          SPICEDB_KEY: testkey
      - run: go build -o authz-proof ./cmd/authz-proof
      - run: |
          ./authz-proof crosscheck --endpoint http://localhost:8443 --key testkey --random 300 \
            examples/drive/schema.zed examples/drive/relationships.txt \
            examples/drive/schema-refactor.zed examples/drive/relationships.txt \
            examples/drive/schema-reordered.zed examples/drive/relationships.txt \
            examples/drive/schema-no-parens.zed examples/drive/relationships.txt

  # The SpiceDB cache reproducer: wrong with the cache on, right with it off.
  spicedb-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start two SpiceDBs
        run: |
          docker run -d --init -p 8444:8443 authzed/spicedb:v1.56.2 \
            serve --grpc-preshared-key testkey --datastore-engine memory --http-enabled
          docker run -d --init -p 8445:8443 authzed/spicedb:v1.56.2 \
            serve --grpc-preshared-key testkey --datastore-engine memory --http-enabled --dispatch-cache-enabled=false
          for p in 8444 8445; do for i in $(seq 30); do curl -s -o /dev/null localhost:$p && break; sleep 1; done; done
      - run: examples/spicedb-cache/check.sh
        env:
          CACHED: http://localhost:8444
          UNCACHED: http://localhost:8445
          KEY: testkey
